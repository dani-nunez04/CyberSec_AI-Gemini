<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot Estilo ChatGPT</title>
<link rel="stylesheet" href="styles.css">
<script src="script.js"></script>
</head>
<body>

<div class="chat-container">
  <div class="chat-window" id="chatWindow"></div>
  <div class="input-container">
    <input type="text" id="userInput" placeholder="Escribe tu pregunta...">
    <button onclick="sendMessage()">Enviar</button>
  </div>
</div>

<!-- Ventana grande -->
<div class="large-window" id="largeWindow">
  <div class="large-window-header">
    Respuesta
    <span class="close-btn" onclick="closeLargeWindow()">✖</span>
  </div>
  <div class="large-window-content" id="largeContent"></div>
</div>

</body>
</html>
